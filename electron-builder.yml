appId: com.vyrovr.preflight
productName: VYRO VR Preflight
copyright: Copyright © 2026 VYRO VR
# Wraps the Linux executable in a launcher that falls back to --no-sandbox
# when Chromium's sandbox can't work (AppImage on Ubuntu 23.10+). No-op for
# the .deb, whose postinst installs a setuid chrome-sandbox helper.
afterPack: build/linux-sandbox-fallback.cjs
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - resources/**/*
  - package.json
# serialport ships a native binding that must stay outside the asar archive so
# it can be loaded at runtime.
asarUnpack:
  - '**/node_modules/@serialport/**'
  - '**/node_modules/serialport/**'
extraResources:
  - from: resources/docs-cache
    to: docs-cache
    filter: ['**/*']
  # Nordic's nrfutil binary for hex/DFU receiver flashing. The binary itself is
  # not committed (large, platform-specific) — drop nrfutil(.exe) into
  # resources/nrfutil/ before packaging; see resources/nrfutil/README.md.
  - from: resources/nrfutil
    to: nrfutil
    filter: ['**/*']
  # Bootloader hex flashed by the hidden developer bulk-flash panel (committed
  # to the repo — see src/shared/config.ts BULK_FLASH).
  - from: resources/dev-firmware
    to: dev-firmware
    filter: ['**/*']
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  # Code-signing: set CSC_LINK + CSC_KEY_PASSWORD in CI to enable.
  # Unsigned builds work but trigger Windows SmartScreen warnings.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VYRO VR Preflight
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # Code-signing / notarization: set CSC_LINK + CSC_KEY_PASSWORD (and the
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID notarization vars)
  # in CI to enable. Unsigned builds run after a Gatekeeper right-click → Open.
  hardenedRuntime: true
  gatekeeperAssess: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  category: Utility
  icon: build/icon.png
  # Required by the .deb target — embedded as the package Maintainer field.
  maintainer: VYRO VR <support@vyrovr.com>
  synopsis: Guided setup and firmware helper for VYRO VR IBIS trackers
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
publish:
  provider: github
  owner: vyro-vr
  repo: preflight
  # Published (not draft) so a release appears automatically on each merge.
  # Switch back to `draft` if you'd rather review/publish releases manually.
  releaseType: release
