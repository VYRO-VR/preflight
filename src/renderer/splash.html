<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>VYRO VR Preflight</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0e1118;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        animation: fade-in 240ms ease-out;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* White rounded card — mirrors the app icon */
      .mark {
        width: 124px;
        height: 124px;
        border-radius: 24px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
      }
      .mark svg {
        display: block;
      }
      .title {
        color: #f4f6fb;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .bar {
        width: 168px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      /* Indeterminate sweep so the splash reads as "working", not frozen */
      .bar::before {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #4f8cff, #7c5cff);
        animation: sweep 1.15s ease-in-out infinite;
      }
      @keyframes sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(310%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        body {
          animation: none;
        }
        .bar::before {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <!-- Capital "O" ring, echoing the Zen Dots app icon -->
      <svg width="78" height="78" viewBox="0 0 78 78" aria-hidden="true">
        <circle cx="39" cy="39" r="29" fill="none" stroke="#111111" stroke-width="13" />
      </svg>
    </div>
    <div class="title">VYRO VR Preflight</div>
    <div class="bar" role="progressbar" aria-label="Loading"></div>
  </body>
</html>
