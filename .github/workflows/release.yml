name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      # Don't cancel the other platforms if one fails — a partial release
      # (e.g. Windows + Linux but no mac) is better than none.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # node-gyp (used to rebuild serialport's native binding) imports the
      # stdlib `distutils`, removed in Python 3.12+. Pin 3.11 so the rebuild
      # works on runners (notably macOS, which compiles the x64 slice).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      # Code signing / notarization is optional, but the CSC_* variables must
      # only exist when the secrets are actually set: electron-builder treats a
      # present-but-empty CSC_LINK as a certificate file path on macOS and dies
      # with "not a file". Export them only when non-empty.
      - name: Build & publish release
        shell: bash
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            export CSC_LINK="$CSC_LINK_SECRET"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_SECRET"
          fi
          if [ -n "$APPLE_ID_SECRET" ]; then
            export APPLE_ID="$APPLE_ID_SECRET"
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_SECRET"
            export APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
          fi
          npx electron-builder ${{ matrix.flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (optional): provide a cert to avoid SmartScreen / Gatekeeper warnings.
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization (optional): set these to notarize the mac build.
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
