name: Build installers (artifacts)

# Builds the Windows, macOS, and Linux installers and uploads them as
# downloadable workflow artifacts. This does NOT publish a GitHub Release — use
# the Release workflow (tag push) for that. Runs on demand, or on pushes to
# working branches.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

jobs:
  build-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
            artifact: preflight-windows
            files: |
              release/*.exe
          - os: macos-latest
            flag: --mac
            artifact: preflight-macos
            files: |
              release/*.dmg
              release/*.zip
          - os: ubuntu-latest
            flag: --linux
            artifact: preflight-linux
            files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Build the installers without publishing anywhere.
      - run: npx electron-builder ${{ matrix.flag }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
