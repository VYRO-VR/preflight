name: Release on merge to main

# Every merge to main bumps the patch version, commits it back, tags it, and
# publishes a GitHub Release with the Windows, macOS, and Linux builds attached.
#
# Notes:
# - The version-bump commit and tag are pushed with GITHUB_TOKEN, which by
#   design does NOT re-trigger workflows, so this never loops. The `if` guard
#   below is a second safety net in case a PAT is ever used instead.
# - Requires main to allow pushes from github-actions[bot] (if branch
#   protection blocks direct pushes, grant the bot a bypass or use a PAT).
on:
  push:
    branches: [main]

# Never let two releases run at once (e.g. two quick merges).
concurrency:
  group: release-on-merge
  cancel-in-progress: false

jobs:
  # Bump the version + push the tag exactly once, on a single runner, so all
  # three platform builds publish to the same release.
  version:
    # Skip the auto-generated bump commit so we don't release twice.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bump patch version
        id: bump
        shell: bash
        run: echo "version=$(npm version patch --no-git-tag-version)" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push the bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.version }}"

  # Build & publish each platform from the freshly-tagged commit.
  release:
    needs: version
    permissions:
      contents: write
    strategy:
      # A partial release beats no release if one platform's build fails.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # node-gyp (used to rebuild serialport's native binding) imports the
      # stdlib `distutils`, removed in Python 3.12+. Pin 3.11 so the rebuild
      # works on runners (notably macOS, which compiles the x64 slice).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci

      - run: npm run build

      # Azure Trusted Signing (Windows) signs via the Invoke-TrustedSigning
      # cmdlet from the TrustedSigning PowerShell module, which isn't preinstalled
      # on the runner. No-op on the mac/linux legs.
      - name: Install Trusted Signing module (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Install-Module -Name TrustedSigning -Force -Repository PSGallery

      - name: Build & publish release
        run: npx electron-builder ${{ matrix.flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows code signing via Azure Trusted Signing (removes SmartScreen
          # warnings). The non-secret signing identity lives in electron-builder.yml;
          # these three are the CI auth for the signing service principal.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # macOS notarization (optional): set these to notarize the mac build.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
